</head>
<body>

<script>
function ans(t){
 let low=t.toLowerCase().trim();

 if(low.includes("3d")||low.includes("print")) return "🖨️ 3D PRINT Jigani\nCustom design + Printing\n₹10/gram + Design charge\n📞 7019289238";
 if(low.includes("bsc")) return "📚 BSc ALL SEM Q PAPERS 2024-25\n\n• Maths: Calculus, Algebra, Analysis\n• Physics, Chemistry, CS\n• Bangalore, BCU, BU\n\nFull PDF: ₹99\n📞 7019289238";

}
function go(){
 var i=document.getElementById('q');var c=document.getElementById('c');var t=i.value.trim();if(!t)return;
 var u=document.createElement('div');u.className='m u';u.textContent=t;c.appendChild(u);
 var b=document.createElement('div');b.className='m ai';b.textContent=ans(t);c.appendChild(b);

}
