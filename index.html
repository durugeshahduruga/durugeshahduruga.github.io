<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MYKE GPT V22</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
.top{background:#00ff00;color:#000;padding:12px;text-align:center;font-weight:900;font-size:18px}
.msg{padding:12px 14px;margin:8px;border-radius:14px;max-width:85%;line-height:1.5}
.me{background:#0a8f5c;align-self:flex-end;color:#fff}
.bot{background:#1e293b;align-self:flex-start;border:1px solid #333}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;padding:10px}
.bar{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #333}
#q{flex:1;padding:15px;border-radius:25px;border:none;background:#222;color:#fff;font-size:16px}
#btn{background:#00ff00;color:#000;border:none;width:60px;height:50px;border-radius:25px;font-weight:900;font-size:22px}
</style>
</head>
<body>
<div class="top">MYKE GPT V22 ✅</div>
<div id="chat">
<div class="msg bot">🙏 Namaste Gelleya! 
Myke / BSc / BCA / PUC Yavude keli!
📞 7019289238</div>
</div>
<div class="bar">
<input id="q" placeholder="Myke rent / BSc papers...">
<button id="btn" onclick="send()">↑</button>
</div>
<script>
function getAns(t){
 let a=t.toLowerCase();
 if(a.includes("myke")||a.includes("mike")||a.includes("mic")||a.includes("rent")){return "🎙️ MYKE RENT JIGANI ✅\n\nSmall Myke: ₹1500 / day\nMedium: ₹3500 / day\nBig DJ Myke: ₹7000 / day\n\n📍 Jigani, Bangalore\n📞 Call/WhatsApp: 7019289238\n\nBook maadi gelleya!"}
 if(a.includes("bsc")){return "📚 BSc ALL SEM Q PAPERS 2024-25\n\nMaths: Calculus, Algebra, Stats\nPhysics, Chemistry, Computer Science\nBU, BCU, Bangalore University\n\nFull PDF Set: ₹99 Only\n📞 7019289238"}
 if(a.includes("bca")){return "📚 BCA 1st to 6th SEM\n\nQ Papers + Notes + Lab Manuals\nBU Pattern\nFull Set: ₹99\n📞 7019289238"}
 if(a.includes("bcom")||a.includes("mcom")){return "📚 BCom / MCom ALL SEM Papers\nFull: ₹99\n📞 7019289238"}
 if(a.includes("puc")||a.includes("12th")||a.includes("12")){return "📚 PUC 1st & 2nd Year\nScience / Commerce / Arts\nQ Papers + Important Q\nFull: ₹99\n📞 7019289238"}
 if(a.includes("10th")||a.includes("sslc")||a.includes("10")){return "📚 SSLC 10th ALL SUBJECTS\n5 Years Papers + Answers\nFull: ₹99\n📞 7019289238"}
 if(a.includes("3d")||a.includes("print")){return "🖨️ 3D PRINTING Jigani\n₹10/gram + Design\n📞 7019289238"}
 if(a.includes("hi")||a.includes("hello")||a.includes("hey")){return "Namaste gelleya! 🙏\nEn beku heli?\n• Myke Rent\n• BSc/BCA Papers\n• PUC/SSLC Papers\n📞 7019289238"}
 return "✅ '"+t+"' \n\nIdu Jigani Center nalli ide gelleya!\nFull PDF / Myke rent sigutte!\n\n📞 WhatsApp Maadi: 7019289238\n\nTry maadi: 'Myke' / 'BSc' / 'BCA' anta type maadi!"
}
function send(){
 let input=document.getElementById('q');
 let chat=document.getElementById('chat');
 let text=input.value.trim();
 if(!text) return;
 let me=document.createElement('div');
 me.className='msg me';
 me.textContent=text;
 chat.appendChild(me);
 let bot=document.createElement('div');
 bot.className='msg bot';
 bot.textContent=getAns(text);
 chat.appendChild(bot);
 input.value='';
 chat.scrollTop=chat.scrollHeight+500;
}
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
</script>
</body>
</html>
